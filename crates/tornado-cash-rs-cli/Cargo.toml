[package]
name = "tornado-cash-rs-cli"
description = "Command line client for Tornado Cash Classic: deposit, withdraw and track notes in an encrypted local database"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tornado-rs"
path = "src/main.rs"

[dependencies]
tornado-cash-rs.workspace = true
alloy = { version = "1", default-features = false, features = ["std", "signers", "signer-local"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
reqwest = { version = "0.13", features = ["socks"] }
rpassword = "7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
